<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#16232E; --bg:#EEF2F0; --panel:#FFFFFF;
    --teal:#1F6F65; --teal-deep:#154F48; --amber:#C99A3B;
    --line:#D7DED9; --text:#1D2422; --muted:#5C6B66; --danger:#B5533C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Vazirmatn',sans-serif;direction:rtl;color:var(--text);font-size:15px;line-height:1.6;padding-bottom:50px;min-height:100vh;}
  h1,h2,h3{font-weight:700;margin:0;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:3px;padding:9px 10px;background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .btn{font-family:inherit;font-weight:600;font-size:13.5px;border:none;border-radius:3px;padding:10px 16px;cursor:pointer;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-amber{background:var(--amber);color:#1D2422;}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  #authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .auth-card{background:var(--panel);border-radius:6px;padding:26px 22px;width:100%;max-width:360px;}
  .auth-logo{width:56px;height:56px;margin:0 auto 12px auto;display:flex;align-items:center;justify-content:center;}
  .auth-title{text-align:center;font-size:18px;margin-bottom:4px;}
  .auth-sub{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  .auth-error{color:var(--danger);font-size:12.5px;margin-bottom:8px;min-height:14px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .auth-tab{flex:1;padding:8px;text-align:center;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);}
  .auth-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .role-pick{display:flex;gap:8px;margin-bottom:12px;}
  .role-pick label{flex:1;border:1px solid var(--line);border-radius:4px;padding:10px 8px;text-align:center;font-size:12.5px;cursor:pointer;color:var(--text);}
  .role-pick input{width:auto;margin-left:6px;}
  .role-pick input:checked + span{font-weight:700;}

  .top{background:var(--ink);color:#F2F4F1;padding:16px 16px 0 16px;position:sticky;top:0;z-index:5;}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .top-row h1{font-size:18px;}
  .top-row .sub{font-size:11px;color:#9FB0AC;}
  .logout-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#EAEFEC;font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;font-family:inherit;}
  .tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.12);}
  .tab-btn{flex:1;background:none;border:none;color:#B7C2BE;font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 2px 12px 2px;cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:#fff;border-bottom-color:var(--amber);}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3FBF7F;margin-left:5px;vertical-align:middle;box-shadow:0 0 0 0 rgba(63,191,127,.6);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,127,.55);}70%{box-shadow:0 0 0 6px rgba(63,191,127,0);}100%{box-shadow:0 0 0 0 rgba(63,191,127,0);}}

  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 20px 14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px;}
  .section-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;}
  .row{display:flex;gap:8px;}
  .row .field{flex:1;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
  .stat .num{font-size:20px;font-weight:800;color:var(--teal-deep);}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .swatch{width:42px;height:42px;border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .item-name{font-weight:600;font-size:14.5px;}
  .item-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .price-cost{color:var(--danger);} .price-sell{color:var(--teal-deep);} .price-margin{color:var(--amber);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .badge-pending{background:#F5E9D0;color:#8A6416;}
  .badge-confirmed{background:#DCEAE7;color:var(--teal-deep);}
  .badge-purchased{background:#E3E9F5;color:#33477A;}
  .badge-shipped{background:#DDEEDC;color:#2C6B2A;}
  .badge-delivered{background:#E8E8E8;color:#4A4A4A;}
  .badge-waiting{background:#EFE3F5;color:#5B2E7A;}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 10px;}
  .item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .item-actions .btn{padding:6px 10px;font-size:12px;}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;}
  .kv .k{color:var(--muted);}
  .stack-total{font-weight:700;font-size:15px;padding-top:6px;border-top:1px solid var(--line);margin-top:6px;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:26px;height:26px;border-radius:3px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;line-height:1;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
  .hint{font-size:12px;color:var(--muted);background:#F5F7F5;border-right:3px solid var(--teal);padding:8px 10px;margin-bottom:14px;border-radius:2px;}
</style>

<script>
(function(){
  if(window.FIREBASE_CONFIG.apiKey === "PASTE_YOUR_API_KEY"){
    document.getElementById('authError').textContent = 'ابتدا پیکربندی Firebase را در بالای فایل index.html وارد کنید.';
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentRole = null;
  let unsubscribers = [];

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function fmt(n){ return Number(n||0).toLocaleString('fa-IR'); }
  function colorFor(id){
    const colors=['#1F6F65','#C99A3B','#33477A','#B5533C','#2C6B2A','#8A6416'];
    let h=0; for(const c of (id||'x')) h=(h*31+c.charCodeAt(0))>>>0;
    return colors[h%colors.length];
  }
  function initials(name){ return (name||'?').trim().slice(0,2); }
  function thumbHtml(id, name, imageUrl){
    if(imageUrl){
      return `<img src="${imageUrl}" alt="${name}" class="swatch" style="object-fit:cover;background:${colorFor(id)}"/>`;
    }
    return `<div class="swatch" style="background:${colorFor(id)}">${initials(name)}</div>`;
  }

  // عکس را روی خود دستگاه کوچک و فشرده می‌کند و به‌صورت متن (data URL) در
  // خود Firestore ذخیره می‌کند — بدون نیاز به Firebase Storage و بدون هزینه.
  function fileToCompressedDataUrl(file, maxDim=640, quality=0.62){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = (e)=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('image load failed'));
        img.onload = ()=>{
          let { width, height } = img;
          if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const statusFlow = ['pending','confirmed','purchased','shipped','delivered'];
  const statusLabels = {
    pending:['در انتظار تأیید','badge-pending'],
    confirmed:['تأیید شد','badge-confirmed'],
    purchased:['خریداری شد از تأمین‌کننده','badge-purchased'],
    shipped:['ارسال شد','badge-shipped'],
    delivered:['تحویل داده شد','badge-delivered'],
  };

  // ---------------- AUTH SCREEN ----------------
  let authMode = 'login';
  document.querySelectorAll('.auth-tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      authMode = t.getAttribute('data-authtab');
      document.getElementById('signupRoleWrap').classList.toggle('hidden', authMode!=='signup');
      document.getElementById('signupInviteWrap').classList.toggle('hidden', authMode!=='signup');
      document.getElementById('signupPhoneWrap').classList.toggle('hidden', authMode!=='signup');
      document.getElementById('signupPhoneOtherWrap').classList.add('hidden');
      document.getElementById('signupProfileWrap').classList.toggle('hidden', authMode!=='signup');
      document.getElementById('authSubmit').textContent = authMode==='signup' ? 'ثبت‌نام' : 'ورود';
      document.getElementById('authError').textContent='';
    });
  });

  document.getElementById('authPhoneCountry').addEventListener('change', (e)=>{
    document.getElementById('signupPhoneOtherWrap').classList.toggle('hidden', e.target.value!=='other');
  });

  document.getElementById('authSubmit').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';
    if(!email || !pass){ errEl.textContent='ایمیل و رمز عبور را وارد کنید.'; return; }
    try{
      if(authMode==='signup'){
        const role = document.querySelector('input[name="signupRole"]:checked').value;
        const inviteCode = document.getElementById('authInvite').value.trim().toUpperCase();
        if(!inviteCode){ errEl.textContent='کد دعوت را وارد کنید.'; return; }

        const countrySelect = document.getElementById('authPhoneCountry').value;
        const countryCode = countrySelect==='other'
          ? document.getElementById('authPhoneCountryOther').value.trim()
          : countrySelect;
        const phoneNumber = document.getElementById('authPhone').value.trim().replace(/^0+/, '');
        if(!countryCode || !countryCode.startsWith('+')){ errEl.textContent='کد کشور را وارد کنید (مثلاً +98).'; return; }
        if(!phoneNumber){ errEl.textContent='شماره موبایل را وارد کنید.'; return; }
        const fullPhone = countryCode + phoneNumber;

        const fullName = document.getElementById('authFullName').value.trim();
        const shopName = document.getElementById('authShopName').value.trim();
        const address = document.getElementById('authAddress').value.trim();
        const postalCode = document.getElementById('authPostalCode').value.trim();
        const emergencyPhone = document.getElementById('authEmergencyPhone').value.trim();
        if(!fullName || !shopName || !address || !postalCode || !emergencyPhone){
          errEl.textContent = 'همه فیلدهای پروفایل (نام، فروشگاه، آدرس، کد پستی، موبایل اضطراری) الزامی است.';
          return;
        }

        // کد دعوت را قبل از ساخت حساب بررسی می‌کنیم تا حساب بی‌جهت ساخته نشود.
        const codeRef = db.collection('inviteCodes').doc(inviteCode);
        const codeSnap = await codeRef.get();
        if(!codeSnap.exists){ errEl.textContent='کد دعوت پیدا نشد.'; return; }
        if(codeSnap.data().used){ errEl.textContent='این کد دعوت قبلاً استفاده شده است.'; return; }

        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(cred.user.uid).set({
          email, role, invitedByCode: inviteCode,
          phoneCountryCode: countryCode, phoneNumber: phoneNumber, phone: fullPhone,
          fullName, shopName, address, postalCode, emergencyPhone,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await codeRef.update({ used:true, usedBy:cred.user.uid, usedByEmail:email, usedAt: firebase.firestore.FieldValue.serverTimestamp() });
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
    }catch(e){
      errEl.textContent = translateAuthError(e.code) || e.message;
    }
  });

  function translateAuthError(code){
    const map = {
      'auth/email-already-in-use':'این ایمیل قبلاً ثبت‌نام کرده — از تب ورود استفاده کنید.',
      'auth/invalid-email':'ایمیل معتبر نیست.',
      'auth/weak-password':'رمز عبور باید حداقل ۶ کاراکتر باشد.',
      'auth/user-not-found':'کاربری با این ایمیل پیدا نشد.',
      'auth/wrong-password':'رمز عبور اشتباه است.',
      'auth/invalid-credential':'ایمیل یا رمز عبور اشتباه است.',
    };
    return map[code];
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut(); });

  auth.onAuthStateChanged(async (user)=>{
    unsubscribers.forEach(u=>u()); unsubscribers=[];
    if(!user){
      currentUser=null; currentRole=null;
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
      return;
    }
    currentUser = user;
    const udoc = await db.collection('users').doc(user.uid).get();
    if(!udoc.exists){ toast('پروفایل کاربری پیدا نشد'); auth.signOut(); return; }
    currentRole = udoc.data().role;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    setupTabsForRole();
  });

  // ---------------- TABS PER ROLE ----------------
  const tabsByRole = {
    admin: [['dashboard','داشبورد'],['products','محصولات'],['orders','سفارش‌ها'],['settings','نرخ ارز'],['support','پشتیبانی'],['invites','دعوت دیگران']],
    importer: [['myproducts','محصولات من'],['support','پشتیبانی'],['invites','دعوت دیگران']],
    customer: [['catalog','فروشگاه'],['myorders','سفارش‌های من'],['support','پشتیبانی'],['invites','دعوت دیگران']],
  };
  const titleByRole = { admin:'بازارچی · مدیر', importer:'بازارچی · واردکننده', customer:'بازارچی · مشتری' };
  const SUPPORT_NAME = 'آقای سید مهدی حسینی';
  const SUPPORT_PHONE = '09179709029';

  function setupTabsForRole(){
    document.getElementById('topTitle').textContent = titleByRole[currentRole] || 'بازارچی';

    supportBar.innerHTML = currentRole==='admin' ? '' : `پشتیبانی ${SUPPORT_NAME}: ${SUPPORT_PHONE}`;
    const bar = document.getElementById('tabsBar');
    const tabs = tabsByRole[currentRole] || [];
    bar.innerHTML = tabs.map((t,i)=>`<button class="tab-btn ${i===0?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
    bar.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        bar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderTab(btn.getAttribute('data-tab'));
      });

  function renderTab(tab){
    unsubscribers.forEach(u=>u()); unsubscribers=[];
    const root = document.getElementById('content');
    root.innerHTML = `<div class="empty">در حال بارگذاری...</div>`;
    if(currentRole==='admin'){
      if(tab==='dashboard') adminDashboard(root);

      else if(tab==='orders') adminOrders(root);
      else if(tab==='settings') adminSettings(root);
      else if(tab==='support') adminSupport(root);
      else if(tab==='invites') invitesTab(root);
    } else if(currentRole==='importer'){
      if(tab==='myproducts') importerProducts(root);
      else if(tab==='support') userSupport(root);
      else if(tab==='invites') invitesTab(root);

      if(tab==='catalog') customerCatalog(root);
      else if(tab==='myorders') customerOrders(root);
      else if(tab==='support') userSupport(root);
      else if(tab==='invites') invitesTab(root);
    }
  }

  // ================= SUPPORT CHAT =================
  function chatBubbleHtml(messages, mineFrom){
    if(!messages || messages.length===0) return `<div class="empty">هنوز پیامی وجود ندارد.</div>`;
    return messages.map(m=>{
      const mine = m.from===mineFrom;
      return `<div style="margin-bottom:8px;text-align:${mine?'left':'right'}">
        <span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:10px;background:${mine?'var(--teal)':'#EEF2F0'};color:${mine?'#fff':'var(--text)'};font-size:13.5px;white-space:pre-wrap">${m.text}</span>
      </div>`;
    }).join('');
  }

  function userSupport(root){
    root.innerHTML = `
      <div class="hint">سؤال یا مشکل خودتان را اینجا بنویسید — ${SUPPORT_NAME} پاسخ می‌دهد.</div>
      <div class="card" style="display:flex;flex-direction:column;height:55vh">
        <div id="chat-messages" style="flex:1;overflow-y:auto;margin-bottom:10px"></div>
        <div class="row" style="margin-bottom:0">
          <input id="chat-input" placeholder="پیام خود را بنویسید..." style="flex:1"/>
          <button class="btn btn-primary" id="chat-send">ارسال</button>
        </div>
      </div>
    `;
    const ticketRef = db.collection('tickets').doc(currentUser.uid);
    const un = ticketRef.onSnapshot(doc=>{
      const messages = doc.exists ? (doc.data().messages||[]) : [];
      const el = root.querySelector('#chat-messages');
      el.innerHTML = chatBubbleHtml(messages, 'user');
      el.scrollTop = el.scrollHeight;
    });
    unsubscribers.push(un);

    async function send(){
      const input = root.querySelector('#chat-input');
      const text = input.value.trim();
      if(!text) return;
      input.value='';
      const msg = { from:'user', text, at: Date.now() };
      const doc = await ticketRef.get();
      if(doc.exists){
        await ticketRef.update({
          messages: firebase.firestore.FieldValue.arrayUnion(msg),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          unreadForAdmin: true
        });
      } else {
        await ticketRef.set({
          userId: currentUser.uid, userEmail: currentUser.email, userRole: currentRole,
          messages: [msg],
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          unreadForAdmin: true, unreadForUser: false
        });
      }
    }
    root.querySelector('#chat-send').addEventListener('click', send);
    root.querySelector('#chat-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
  }

  const profileCache = {};
  async function getUserProfile(uid){
    if(profileCache[uid]) return profileCache[uid];
    try{
      const doc = await db.collection('users').doc(uid).get();
      const data = doc.exists ? doc.data() : {};
      profileCache[uid] = data;
      return data;
    }catch(e){ return {}; }
  }

  async function resolveCostPrices(items){
    // Orders come from customers, who can't read cost prices (blocked by security
    // rules). The admin looks up the real cost from importerProducts here instead.
    const out = [];
    for(const it of items){
      let cost = it.costPrice||0;
      try{
        const doc = await db.collection('importerProducts').doc(it.productId).get();
        if(doc.exists) cost = doc.data().unitCostPrice||0;
      }catch(e){}
      out.push({...it, costPrice:cost});
    }
    return out;
  }

        ratesCache = { usdToToman, aedToToman };

        // بازمحاسبه‌ی همه محصولاتی که به دلار یا درهم ثبت شده‌اند
        const snap = await db.collection('importerProducts').get();
        const toUpdate = snap.docs.filter(d=>{
          const c = d.data().costCurrency;
          return c === 'USD' || c === 'AED';
        });
        let count = 0;
        for(const d of toUpdate){
          const p = d.data();
          const unitCostPrice = toToman(p.costAmount, p.costCurrency, ratesCache);
          const { shippingPerUnit, marginPerUnit, sellPrice } = computePricing(unitCostPrice, p.weightValue);
          await db.collection('importerProducts').doc(d.id).update({ unitCostPrice, marginPerUnit, shippingPerUnit, sellPrice });
          await db.collection('catalog').doc(d.id).update({ sellPrice });
          count++;
          status.textContent = `به‌روزرسانی شد: ${count} از ${toUpdate.length}`;
        }
        btn.disabled = false; btn.textContent = 'ذخیره و به‌روزرسانی همه قیمت‌ها';
        status.textContent = `تمام شد — ${count} محصول با نرخ جدید به‌روزرسانی شد.`;
        toast('نرخ ارز و قیمت‌ها به‌روزرسانی شد');
      });
    });
  }

  // ================= IMPORTER =================
  const SHIPPING_PER_KG = 130000;
  const MARGIN_RATE = 0.03;
  const DOZEN = 12;

  function computePricing(unitCostPrice, weightValue){
    const weightKg = (weightValue||0) / 1000; // گرم یا میل، هر دو تقریباً معادل گرم محاسبه می‌شود
    const shippingPerUnit = Math.round(weightKg * SHIPPING_PER_KG);
    const marginPerUnit = Math.round((unitCostPrice||0) * MARGIN_RATE);
    const sellPrice = (unitCostPrice||0) + marginPerUnit + shippingPerUnit;
    return { shippingPerUnit, marginPerUnit, sellPrice };
  }

  // ---------------- نرخ ارز ----------------
  let ratesCache = null;
  async function getRates(){
    if(ratesCache) return ratesCache;
    try{
      const doc = await db.collection('settings').doc('exchangeRates').get();
      ratesCache = doc.exists ? doc.data() : { usdToToman: 0, aedToToman: 0 };
    }catch(e){
      ratesCache = { usdToToman: 0, aedToToman: 0 };
    }
    return ratesCache;
  }
  function toToman(amount, currency, rates){
    amount = Number(amount)||0;
    if(currency === 'USD') return Math.round(amount * (rates.usdToToman||0));
    if(currency === 'AED') return Math.round(amount * (rates.aedToToman||0));
    return Math.round(amount);
  }
  const currencyLabel = { IRT:'تومان', USD:'دلار آمریکا', AED:'درهم امارات' };

  function importerProducts(root){
    root.innerHTML = `
      <div class="hint">شما فقط محصولات خودتان را می‌بینید. اطلاعات مشتری نهایی هرگز به شما نمایش داده نمی‌شود. قیمت فروش نهایی به‌طور خودکار محاسبه و همان لحظه در فروشگاه منتشر می‌شود.</div>
      <div class="card">
        <div class="section-label">افزودن محصول جدید</div>
        <div class="field"><label>عکس محصول</label><input id="ip-image" type="file" accept="image/*"/></div>
        <div class="field"><label>نام محصول</label><input id="ip-name" placeholder="مثلاً اسپری رکسونا ۲۰۰ میل"/></div>
        <div class="field"><label>ساخت کدام کشور</label><input id="ip-country" placeholder="مثلاً امارات"/></div>
        <div class="row">
          <div class="field"><label>وزن/حجم هر عدد</label><input id="ip-weight" type="number" placeholder="200"/></div>
          <div class="field" style="flex:0 0 40%">
            <label>واحد</label>
            <select id="ip-weight-unit"><option value="ml">میلی‌لیتر</option><option value="g">گرم</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>تعداد رایحه‌های محصول</label><input id="ip-fragrances" type="number" placeholder="مثلاً 15" value="1"/></div>
          <div class="field"><label>موجودی کل (عدد)</label><input id="ip-stock" type="number"/></div>
        </div>
        <div class="row">
          <div class="field"><label>قیمت هر عدد نزد شما</label><input id="ip-cost" type="number" placeholder="120000"/></div>
          <div class="field" style="flex:0 0 42%">
            <label>ارز</label>
            <select id="ip-currency">
              <option value="IRT">تومان</option>
              <option value="USD">دلار آمریکا</option>
              <option value="AED">درهم امارات</option>
            </select>
          </div>
        </div>

        <div class="divider" style="border-top:1px solid var(--line);margin:12px 0"></div>
        <div id="ip-preview" class="item-sub"></div>

        <button class="btn btn-primary btn-block" id="ip-add" style="margin-top:10px">افزودن و انتشار در فروشگاه</button>
      </div>
      <div class="card">
        <div class="section-label">محصولات ثبت‌شده شما</div>
        <div id="ip-list"></div>
      </div>
    `;

    let rates = { usdToToman:0, aedToToman:0 };
    getRates().then(r=>{ rates = r; updatePreview(); });

    function updatePreview(){
      const amount = Number(root.querySelector('#ip-cost').value)||0;
      const currency = root.querySelector('#ip-currency').value;
      const cost = toToman(amount, currency, rates);
      const weight = Number(root.querySelector('#ip-weight').value)||0;
      const fragrances = Number(root.querySelector('#ip-fragrances').value)||1;
      const { shippingPerUnit, marginPerUnit, sellPrice } = computePricing(cost, weight);
      const minOrderQty = fragrances * DOZEN;
      const rateNote = currency!=='IRT' ? `(معادل ${fmt(cost)} تومان با نرخ فعلی)<br/>` : '';
      root.querySelector('#ip-preview').innerHTML =
        rateNote +
        `سود ما (۳٪): <span class="price-margin">${fmt(marginPerUnit)}</span> تومان · هزینه پست: <span class="price-margin">${fmt(shippingPerUnit)}</span> تومان<br/>` +
        `<b>قیمت فروش نهایی به مشتری: <span class="price-sell">${fmt(sellPrice)}</span> تومان</b><br/>` +
        `حداقل سفارش این محصول: <b>${fmt(minOrderQty)} عدد</b> (${fmt(fragrances)} رایحه × ۱۲ عدد)`;
    }
    ['#ip-cost','#ip-weight','#ip-fragrances','#ip-currency'].forEach(sel=>{
      root.querySelector(sel).addEventListener('input', updatePreview);
      root.querySelector(sel).addEventListener('change', updatePreview);
    });
    updatePreview();

    root.querySelector('#ip-add').addEventListener('click', async ()=>{
      const name = root.querySelector('#ip-name').value.trim();
      const countryOfOrigin = root.querySelector('#ip-country').value.trim();
      const weightValue = Number(root.querySelector('#ip-weight').value);
      const weightUnit = root.querySelector('#ip-weight-unit').value;
      const fragranceCount = Number(root.querySelector('#ip-fragrances').value) || 1;
      const stock = Number(root.querySelector('#ip-stock').value)||0;
      const costAmount = Number(root.querySelector('#ip-cost').value);
      const costCurrency = root.querySelector('#ip-currency').value;
      const imageFile = root.querySelector('#ip-image').files[0];
      if(!name || !countryOfOrigin || !weightValue || !costAmount){
        toast('نام، کشور سازنده، وزن و قیمت را وارد کنید'); return;
      }
      if(!imageFile){ toast('عکس محصول را انتخاب کنید'); return; }

      const addBtn = root.querySelector('#ip-add');
      addBtn.disabled = true; addBtn.textContent = 'در حال آماده‌سازی عکس...';

      const currentRates = await getRates();
      const unitCostPrice = toToman(costAmount, costCurrency, currentRates);
      const { shippingPerUnit, marginPerUnit, sellPrice } = computePricing(unitCostPrice, weightValue);
      const minOrderQty = fragranceCount * DOZEN;
      const docRef = db.collection('importerProducts').doc();

      let imageUrl = '';
      try{
        imageUrl = await fileToCompressedDataUrl(imageFile);
      }catch(e){
        toast('پردازش عکس ناموفق بود، عکس دیگری را امتحان کنید');
        addBtn.disabled = false; addBtn.textContent = 'افزودن و انتشار در فروشگاه';
        return;
      }
      addBtn.textContent = 'در حال ثبت...';

      if(imageUrl.length > 900000){
        // اگر عکس بعد از فشرده‌سازی هنوز خیلی بزرگ بود (عکس با کیفیت خیلی بالا)، دوباره فشرده‌تر می‌کنیم.
        try{ imageUrl = await fileToCompressedDataUrl(imageFile, 420, 0.45); }catch(e){}
      }

      const payload = {
        importerId: currentUser.uid, importerEmail: currentUser.email,
        name, countryOfOrigin, weightValue, weightUnit, fragranceCount, minOrderQty,
        stock, costAmount, costCurrency, unitCostPrice, marginPerUnit, shippingPerUnit, sellPrice, imageUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try{
        await docRef.set(payload);
        await db.collection('catalog').doc(docRef.id).set({
          name, countryOfOrigin, weightValue, weightUnit, fragranceCount, minOrderQty,
          stock, sellPrice, imageUrl, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }catch(e){
        toast('ثبت ناموفق بود — عکس را با کیفیت پایین‌تر امتحان کنید');
        addBtn.disabled = false; addBtn.textContent = 'افزودن و انتشار در فروشگاه';
        return;
      }

      root.querySelector('#ip-name').value='';
      root.querySelector('#ip-country').value='';
      root.querySelector('#ip-weight').value='';
      root.querySelector('#ip-fragrances').value='1';
      root.querySelector('#ip-stock').value='';
      root.querySelector('#ip-cost').value='';
      root.querySelector('#ip-image').value='';
      updatePreview();
      addBtn.disabled = false; addBtn.textContent = 'افزودن و انتشار در فروشگاه';
      toast('محصول ثبت و در فروشگاه منتشر شد');
    });

    const un = db.collection('importerProducts').where('importerId','==',currentUser.uid).onSnapshot(snap=>{
      const el = root.querySelector('#ip-list');
      if(snap.empty){ el.innerHTML = `<div class="empty">هنوز محصولی ثبت نکرده‌اید.</div>`; return; }
      el.innerHTML = snap.docs.map(d=>{
        const p = d.data();
        const weightLabel = p.weightUnit==='ml' ? 'میل' : 'گرم';
        return `
        <div class="list-item">
          ${thumbHtml(d.id, p.name, p.imageUrl)}
          <div style="flex:1">
            <div class="item-name">${p.name} <span class="badge badge-delivered">فعال در فروشگاه</span></div>
            <div class="item-sub">${p.countryOfOrigin} · ${fmt(p.weightValue)} ${weightLabel} · ${fmt(p.fragranceCount)} رایحه · حداقل سفارش ${fmt(p.minOrderQty)} عدد</div>
            <div class="item-sub">قیمت شما: <span class="price-cost">${fmt(p.costAmount||p.unitCostPrice)} ${currencyLabel[p.costCurrency]||'تومان'}</span> (≈${fmt(p.unitCostPrice)} تومان) → فروش نهایی: <span class="price-sell">${fmt(p.sellPrice)}</span> · موجودی ${fmt(p.stock)}</div>
          </div>
        </div>`;
      }).join('');
    });
    unsubscribers.push(un);
  }

  // ================= CUSTOMER =================
  let cart = {};
  function customerCatalog(root){
    root.innerHTML = `
      <div class="hint">📦 هزینه و مسئولیت ارسال به سراسر کشور، از مبدأ تا مقصد، بر عهده‌ی ماست و در قیمت‌های زیر لحاظ شده — نیازی به پرداخت جداگانه بابت پست نیست.</div>
      <div class="card"><div class="section-label">فروشگاه</div><div id="cat-list"></div></div>
      <div id="cart-area"></div>
    `;
    const un = db.collection('catalog').onSnapshot(snap=>{
      const products = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const el = root.querySelector('#cat-list');
      el.innerHTML = products.length===0 ? `<div class="empty">فعلاً کالایی موجود نیست.</div>` : products.map(p=>{
        const weightLabel = p.weightUnit==='ml' ? 'میل' : 'گرم';
        const qty = cart[p.id]||0;
        return `
        <div class="list-item">
          ${thumbHtml(p.id, p.name, p.imageUrl)}
          <div style="flex:1">
            <div class="item-name">${p.name}</div>
            <div class="item-sub">ساخت: ${p.countryOfOrigin||'—'} · ${fmt(p.weightValue)} ${weightLabel} · ${fmt(p.fragranceCount)} رایحه</div>
            <div class="item-sub">قیمت هر عدد: <span class="price-sell">${fmt(p.sellPrice)} تومان</span> · موجودی ${fmt(p.stock)}</div>
            <div class="item-sub">حداقل سفارش: <b>${fmt(p.minOrderQty)} عدد</b> (۱۲ عدد از هر رایحه)</div>
          </div>
          <div class="qty-ctrl">
            <button data-dec="${p.id}">−</button>
            <span>${qty}</span>
            <button data-inc="${p.id}">+</button>
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{
        const id=b.getAttribute('data-inc');
        const p = products.find(x=>x.id===id);
        const min = p.minOrderQty || DOZEN;
        cart[id] = cart[id] ? cart[id] + DOZEN : min;
        renderCart(root, products);
      }));
      el.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{
        const id=b.getAttribute('data-dec');
        const p = products.find(x=>x.id===id);
        const min = p.minOrderQty || DOZEN;
        const next = (cart[id]||0) - DOZEN;
        cart[id] = next < min ? 0 : next;
        renderCart(root, products);
      }));
      renderCart(root, products);
    });
    unsubscribers.push(un);
  }

  function renderCart(root, products){
    const ids = Object.keys(cart).filter(id=>cart[id]>0);
    const area = root.querySelector('#cart-area');
    if(!area) return;
    if(ids.length===0){ area.innerHTML=''; return; }
    const total = ids.reduce((s,id)=>{
      const p = products.find(x=>x.id===id); return p? s+p.sellPrice*cart[id] : s;
    },0);
    area.innerHTML = `
      <div class="card">
        <div class="section-label">سبد خرید</div>
        ${ids.map(id=>{
          const p = products.find(x=>x.id===id); if(!p) return '';
          return `<div class="kv"><span class="k">${p.name} ×${cart[id]}</span><span>${fmt(p.sellPrice*cart[id])}</span></div>`;
        }).join('')}
        <div class="kv stack-total"><span>جمع کل</span><span>${fmt(total)} تومان</span></div>
        <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:10px">ثبت سفارش</button>
      </div>
    `;
    area.querySelector('#checkout-btn').addEventListener('click', async ()=>{
      // customers can't read cost price (security rules block it) — orders store
      // productId only for cost; the admin view resolves the real cost price itself.
      const orderItems = ids.map(id=>{
        const p = products.find(x=>x.id===id);
        return {productId:id, name:p.name, qty:cart[id], sellPrice:p.sellPrice, costPrice:0, minOrderQty:p.minOrderQty||DOZEN, imageUrl:p.imageUrl||''};
      });
      await db.collection('orders').add({
        customerId: currentUser.uid, customerEmail: currentUser.email,
        items: orderItems, status:'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      cart = {};
      toast('سفارش ثبت شد');
      renderTab('catalog');
    });
  }

  let editingOrderId = null;
  let editCart = {};

  function customerOrders(root){
    root.innerHTML = `<div class="card"><div class="section-label">سفارش‌های شما</div><div id="myord-list"></div></div>`;
    const un = db.collection('orders').where('customerId','==',currentUser.uid).orderBy('createdAt','desc').onSnapshot(snap=>{
      const el = root.querySelector('#myord-list');
      if(snap.empty){ el.innerHTML = `<div class="empty">هنوز سفارشی ثبت نکرده‌اید.</div>`; return; }
      el.innerHTML = snap.docs.map(d=>{
        const o = d.data();
        const total = o.items.reduce((s,it)=>s+it.sellPrice*it.qty,0);
        const [label,cls] = statusLabels[o.status];
        const canEdit = o.status === 'pending';

        if(editingOrderId === d.id){
          const items = o.items.map(it=>({...it, qty: editCart[it.productId] ?? it.qty}));
          const editTotal = items.reduce((s,it)=>s+it.sellPrice*it.qty,0);
          return `<div class="list-item" style="display:block">
            <div class="item-name" style="margin-bottom:8px">ویرایش سفارش</div>
            ${items.map(it=>`
              <div class="list-item">
                ${thumbHtml(it.productId, it.name, it.imageUrl)}
                <div style="flex:1">
                  <div class="item-name">${it.name}</div>
                  <div class="item-sub">${fmt(it.sellPrice)} تومان · حداقل ${fmt(it.minOrderQty)} عدد</div>
                </div>
                <div class="qty-ctrl">
                  <button data-edec="${it.productId}">−</button>
                  <span>${it.qty}</span>
                  <button data-einc="${it.productId}">+</button>
                </div>
              </div>
            `).join('')}
            <div class="kv stack-total"><span>جمع کل</span><span>${fmt(editTotal)} تومان</span></div>
            <div class="item-actions" style="margin-top:10px">
              <button class="btn btn-primary" data-save-edit="${d.id}">ذخیره تغییرات</button>
              <button class="btn btn-ghost" data-cancel-edit="1">انصراف از ویرایش</button>
            </div>
          </div>`;
        }

        return `<div class="list-item"><div style="flex:1">
          <div class="item-name">${o.items.map(it=>it.name+' ×'+it.qty).join('، ')} <span class="badge ${cls}">${label}</span></div>
          <div class="item-sub">مبلغ: ${fmt(total)} تومان</div>
          ${canEdit ? `<div class="item-actions">
            <button class="btn btn-ghost" data-edit-order="${d.id}">ویرایش</button>
            <button class="btn btn-danger" data-cancel-order="${d.id}">لغو سفارش</button>
          </div>` : ''}
        </div></div>`;
      }).join('');

      el.querySelectorAll('[data-edit-order]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.getAttribute('data-edit-order');
          const o = snap.docs.find(x=>x.id===id).data();
          editingOrderId = id;
          editCart = {};
          o.items.forEach(it=>{ editCart[it.productId] = it.qty; });
          customerOrders(root);
        });
      });
      el.querySelectorAll('[data-cancel-edit]').forEach(btn=>{
        btn.addEventListener('click', ()=>{ editingOrderId=null; editCart={}; customerOrders(root); });
      });
      el.querySelectorAll('[data-einc]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const pid = btn.getAttribute('data-einc');
          editCart[pid] = (editCart[pid]||0) + DOZEN;
          customerOrders(root);
        });
      });
      el.querySelectorAll('[data-edec]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const pid = btn.getAttribute('data-edec');
          const o = snap.docs.find(x=>x.id===editingOrderId).data();
          const item = o.items.find(it=>it.productId===pid);
          const min = item ? item.minOrderQty : DOZEN;
          const next = (editCart[pid]||0) - DOZEN;
          editCart[pid] = next < min ? 0 : next;
          customerOrders(root);
        });
      });
      el.querySelectorAll('[data-save-edit]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const id = btn.getAttribute('data-save-edit');
          const o = snap.docs.find(x=>x.id===id).data();
          const newItems = o.items
            .map(it=>({...it, qty: editCart[it.productId] ?? it.qty}))
            .filter(it=>it.qty > 0);
          if(newItems.length===0){
            if(!confirm('همه اقلام حذف شدند — کل سفارش لغو شود؟')) return;
            await db.collection('orders').doc(id).delete();
          } else {
            await db.collection('orders').doc(id).update({ items: newItems });
          }
          editingOrderId = null; editCart = {};
          toast('سفارش به‌روزرسانی شد');
        });
      });
      el.querySelectorAll('[data-cancel-order]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          if(!confirm('این سفارش لغو شود؟')) return;
          await db.collection('orders').doc(btn.getAttribute('data-cancel-order')).delete();
          toast('سفارش لغو شد');
        });
      });
    });
    unsubscribers.push(un);
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./service-worker.js').catch(()=>{}); });
  }
})();
</script>
</body>
</html>
